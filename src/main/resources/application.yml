server:
  port: 8080

spring:
  application:
    name: daily-checkin-server
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/daily_checkin?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
    username: root
    password: 6duRktRA

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
      # @TableLogic 字段取值：撤销置 1、有效为 0（与 schema.sql 建表默认值保持一致）
      logic-delete-value: 1
      logic-not-delete-value: 0

# 小程序 AppID 是公开标识；AppSecret 必须只在服务端配置，严禁下发到小程序端。
wx:
  appid: wx75eaa2072b739e40
  secret: e6b9793cfd1dcebc7d68cdc5d7da53d8
  code2session-url: https://api.weixin.qq.com/sns/jscode2session
  # 本地联调开关：true 时跳过微信接口、用 code 生成稳定的模拟 openid；生产必须为 false。
  dev-mode: ${WX_DEV_MODE:false}

checkin:
  token-ttl-hours: 720
  zone: Asia/Shanghai
  # 每个用户最多可拥有的签到任务数（已删除的不占名额）
  task-limit: 10
  # 签到积分：每天仅首次签到计分，连续签到按档位递增，断签回到初始档，单次不超过 max。
  points:
    base: 1          # 首次 / 断签后每次签到得分
    step-days: 3     # 每连续几天升一档
    step-points: 1   # 每档增加的得分
    max: 5           # 单次签到得分上限
